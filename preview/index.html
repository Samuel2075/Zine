<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização do Zine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="btnVoltarIncio" class="btn-voltar" style="cursor: pointer;">← Voltar</button>
            <button id="btnAbrirComentario" class="btn btn-sm btn-outline-light">💬 Comentar Página</button>
        </div>
        <div>
            <span id="zineTitle">Carregando Zine...</span>
        </div>
    </div>

    <section id="bookContainer"></section>

    <div class="carousel__nav">
        <span class="carousel__arrow" id="prevBtn">&#10094;</span>
        <span class="carousel__arrow" id="nextBtn">&#10095;</span>
    </div>

    <div class="modal fade" id="modalComentario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Deixar Comentário na Página</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body position-relative">
                    <div id="seletorPaginaContainer" class="mb-3 d-none">
                        <label class="form-label">Esta é uma página dupla. Em qual página deseja comentar?</label>
                        <select id="selectPaginaAlvo" class="form-select bg-secondary text-white border-0"></select>
                    </div>

                    <div class="mb-2 d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary btn-emoji">👍</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary btn-emoji">❤️</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary btn-emoji">🔥</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary btn-emoji">😮</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary btn-emoji">🎉</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary btn-emoji">🚀</button>
                    </div>

                    <div class="mb-3">
                        <label for="txtComentario" class="form-label">Seu Comentário (digite @ para citar seus zines):</label>
                        <textarea id="txtComentario" class="form-control bg-secondary text-white border-0" rows="3" placeholder="Escreva aqui... Use @ para mencionar um zine seu."></textarea>
                        <div id="sugestoesMentions" class="list-group position-absolute shadow w-100 d-none" style="z-index: 1050; max-height: 150px; overflow-y: auto;"></div>
                    </div>

                    <div class="mb-3">
                        <label for="inputAnexo" class="form-label">Anexar Imagem (Opcional):</label>
                        <input type="file" id="inputAnexo" accept="image/*" class="form-control form-control-sm bg-secondary text-white border-0">
                        <div id="previewAnexoContainer" class="mt-2 d-none">
                            <img id="imgPreviewAnexo" src="" alt="Preview Anexo" class="img-thumbnail" style="max-height: 100px;">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnSalvarComentario" class="btn btn-primary btn-sm">Salvar Comentário</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btnVoltarIncio').addEventListener('click', function(e) {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const zineId = urlParams.get("id");
            const origin = urlParams.get("origin");

            if (origin === "create" && zineId) {
                window.location.href = `../createZine/index.html?edit=${zineId}`;
            } else {
                window.location.href = '../index.html';
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>

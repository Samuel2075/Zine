<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Criar Novo Zine</title>
</head>

<body class="bg-light">
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-md-12 d-flex justify-content-between align-items-center">
                <h2>Criar Novo Zine</h2>
                <button id="btnLogout" class="btn btn-outline-danger btn-sm">Sair / Trocar Conta</button>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <form id="zineForm">
                    <!-- Input para o nome do Zine com sugestão sequencial -->
                    <div class="mb-3">
                        <label for="zineName" class="form-label">Nome do Zine</label>
                        <input type="text" class="form-control" id="zineName" required>
                    </div>

                    <!-- Select de Templates -->
                    <div class="mb-3">
                        <label for="templateSelect" class="form-label">Template (Quantidade de Capas)</label>
                        <select class="form-control" id="templateSelect" required>
                            <option value="" selected disabled>Selecione um template</option>
                            <option value="8">8</option>
                            <option value="16">16</option>
                            <option value="24">24</option>
                            <option value="32">32</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <!-- Cards gerados dinamicamente -->
        <div id="templatesUpload" class="row"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script type="module" src="script.js"></script>
</body>

</html>

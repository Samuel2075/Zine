<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização do Zine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar" style="position: fixed; top: 10px; left: 20px; z-index: 10;">
        <a href="../index.html" style="color: #fff; text-decoration: none; background: #222; padding: 8px 15px; border-radius: 4px; font-size: 14px;">← Voltar ao Início</a>
        <span id="zineTitle" style="color: #fff; margin-left: 20px; font-weight: bold; font-size: 18px;">Carregando Zine...</span>
    </div>

    <section id="magazineContainer" class="magazine carousel">
        <!-- Os itens do carrossel em formato de páginas duplas serão injetados aqui via JS -->
        
        <div class="pageNav carousel__nav">
            <span id="moveLeft" class="carousel__arrow">&#10094;</span>
            <span id="moveRight" class="carousel__arrow">&#10095;</span>
        </div>
    </section>

    <script type="module" src="script.js"></script>
</body>
</html>

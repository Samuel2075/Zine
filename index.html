<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine Card - Login Google</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-light">

    <!-- Container para Notificações Personalizadas -->
    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div id="loginCard" class="card shadow-sm p-4 text-center">
                    <h3 class="mb-3">Bem-vindo ao Zine</h3>
                    <p class="text-muted">Conecte-se com sua conta Google para gerenciar seus templates e salvar arquivos no seu Drive.</p>
                    <button id="btnGoogleLogin" class="btn btn-outline-dark d-flex align-items-center justify-content-center gap-2 py-2">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                        Entrar / Vincular com o Google
                    </button>
                </div>

                <div id="profileCard" class="card shadow-sm p-4 text-center d-none">
                    <div class="mb-3">
                        <img id="userAvatar" src="assets/imgNotFound.jpg" alt="Foto de Perfil" class="rounded-circle border" width="90" height="90" style="object-fit: cover;">
                    </div>
                    <h4 id="userNickname" class="mb-1"></h4>
                    <p id="userEmail" class="text-muted small mb-3"></p>
                    
                    <hr>
                    <div class="d-grid gap-2">
                        <a href="createZine/index.htm" class="btn btn-primary">Criar novo Zine</a>
                        <button id="btnLogout" class="btn btn-outline-danger btn-sm">Sair</button>
                    </div>
                </div>

            </div>
        </div>

        <div id="listaZinesSection" class="row mt-5 d-none">
            <!-- Seção 1: Meus Zines (Públicos e Rascunhos) -->
            <div class="col-12 mb-5">
                <h3 class="mb-4 border-bottom pb-2">Meus Zines</h3>
                <div id="meusZinesContainer" class="row">
                </div>
            </div>

            <!-- Seção 2: Zines Publicados da Comunidade -->
            <div class="col-12">
                <h3 class="mb-4 border-bottom pb-2">Zines Publicados (Comunidade)</h3>
                <div id="zinesPublicadosContainer" class="row">
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação de Exclusão Customizado -->
    <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-labelledby="modalConfirmacaoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalConfirmacaoLabel">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir este zine permanentemente?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarExclusao" class="btn btn-danger btn-sm">Sim, Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script type="module" src="script.js"></script>
</body>
</html>

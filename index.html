<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <!-- Barra Superior / Perfil Integrado (Inicia oculta com d-none) -->
    <header class="zine-top-nav d-none" id="mainHeader">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <div class="d-flex align-items-center gap-2">
                <span class="fs-5 fw-bold text-white tracking-wide">✨ Zine Platform</span>
            </div>

            <!-- Estado de Perfil (Conectado) -->
            <div id="profileCard" class="d-flex align-items-center gap-3">
                <img id="userAvatar" src="assets/imgNotFound.jpg" alt="Perfil"
                    class="rounded-circle border border-secondary" width="38" height="38" style="object-fit: cover;">
                <div class="d-flex align-items-center gap-2">
                    <div class="d-none d-sm-block text-start">
                        <h6 id="userNickname" class="mb-0 text-white fw-bold" style="font-size: 0.9rem;"></h6>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a href="createZine/index.html" class="btn btn-sm btn-accent fw-semibold px-3 py-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-plus-lg text-light" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z" />
                        </svg>
                    </a>
                    <a href="perfil/index.html" class="btn btn-sm btn-dark-custom py-1.5 px-2" title="Meu Perfil"><svg
                            xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#ffffff"
                            class="bi bi-person-fill" viewBox="0 0 16 16">
                            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
                        </svg></a>
                    <button id="btnLogout" class="btn btn-sm btn-outline-danger py-1.5 px-2"
                        title="Sair da Conta">Sair</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Card Central de Login (Aparece apenas quando deslogado) -->
    <div id="loginCard" class="container d-flex flex-column justify-content-center align-items-center"
        style="height: 100vh;">
        <div class="text-center p-5 card-custom shadow-lg" style="max-width: 400px; width: 100%;">
            <h3 class="text-white mb-3 fw-bold">✨ Zine Platform</h3>
            <p class="text-secondary mb-4 small">Entre com a sua conta Google para criar, gerir e visualizar os seus
                zines.</p>
            <button id="btnGoogleLogin"
                class="btn btn-dark-custom d-flex align-items-center justify-content-center gap-2 px-4 py-2 w-100 shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18">
                Entrar com o Google
            </button>
        </div>
    </div>

    <div class="container py-4">
        <div id="listaZinesSection" class="row mt-4 d-none">
            <div class="col-12 mb-5">
                <h3 class="section-title mb-4">Meus Zines</h3>
                <div id="meusZinesContainer" class="zine-mosaic-grid"></div>
            </div>

            <div class="col-12">
                <h3 class="section-title mb-4">Zines Publicados (Comunidade)</h3>
                <div id="zinesPublicadosContainer" class="zine-mosaic-grid"></div>
            </div>
        </div>
    </div>

    <!-- Modais -->
    <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-dark">
                <div class="modal-header border-bottom border-dark">
                    <h5 class="modal-title text-danger">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-secondary">Tem certeza que deseja excluir este zine permanentemente?</div>
                <div class="modal-footer border-top border-dark">
                    <button type="button" class="btn btn-dark-custom btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarExclusao" class="btn btn-danger btn-sm">Sim, Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalVerComentarios" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content modal-content-dark">
                <div class="modal-header modal-header-dark px-4 py-3">
                    <h5 class="modal-title fw-semibold fs-5 text-light d-flex align-items-center gap-2">
                        💬 Comentários da Página
                    </h5>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="listaComentariosModalBody" style="background-color: #121212;"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalZoomImagem" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0 text-end p-2">
                <button type="button" class="btn-close btn-close-white m-2 shadow-none" data-bs-dismiss="modal"
                    aria-label="Close"></button>
                <div class="modal-body text-center p-0">
                    <img id="imgZoomPreview" src="" alt="Imagem Ampliada" class="img-fluid rounded shadow-lg"
                        style="max-height: 85vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>

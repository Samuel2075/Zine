<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        /* Cards do Perfil e Login */
        .card-custom {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            color: #e0e0e0;
        }

        /* Cards dos Zines */
        .zine-card {
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }
        .zine-card:hover {
            border-color: #404040;
            transform: translateY(-2px);
        }

        /* Títulos e divisórias */
        .section-title {
            color: #ffffff;
            border-bottom: 1px solid #262626;
            padding-bottom: 0.5rem;
            font-weight: 600;
        }

        /* Botões padronizados */
        .btn-dark-custom {
            background-color: #222222;
            border: 1px solid #333333;
            color: #e0e0e0;
        }
        .btn-dark-custom:hover {
            background-color: #2f2f2f;
            border-color: #444444;
            color: #ffffff;
        }

        .btn-accent {
            background-color: #2563eb;
            border: none;
            color: #ffffff;
        }
        .btn-accent:hover {
            background-color: #1d4ed8;
            color: #ffffff;
        }

        /* Modais */
        .modal-content-dark {
            background-color: #161616;
            border: 1px solid #262626;
            color: #e0e0e0;
            border-radius: 12px;
        }
        .modal-header-dark {
            background-color: #1f1f1f;
            border-bottom: 1px solid #262626;
        }
    </style>
</head>
<body>

    <!-- Container para Notificações Personalizadas -->
    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Card de Login -->
                <div id="loginCard" class="card card-custom shadow-lg p-4 text-center">
                    <h3 class="mb-3 text-white fw-bold">Bem-vindo ao Zine</h3>
                    <p class="text-secondary small mb-4">Conecte-se com sua conta Google para gerenciar seus templates e salvar seus zines.</p>
                    <button id="btnGoogleLogin" class="btn btn-dark-custom d-flex align-items-center justify-content-center gap-2 py-2 w-100">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                        Entrar com o Google
                    </button>
                </div>

                <!-- Card de Perfil Logado -->
                <div id="profileCard" class="card card-custom shadow-lg p-4 text-center d-none">
                    <div class="mb-3">
                        <img id="userAvatar" src="assets/imgNotFound.jpg" alt="Foto de Perfil" class="rounded-circle border border-secondary shadow-sm" width="90" height="90" style="object-fit: cover;">
                    </div>
                    <h4 id="userNickname" class="mb-1 text-white fw-bold"></h4>
                    <p id="userEmail" class="text-secondary small mb-3"></p>
                    
                    <hr class="border-secondary opacity-25">
                    <div class="d-grid gap-2">
                        <a href="createZine/index.htm" class="btn btn-accent py-2 fw-semibold">✨ Criar novo Zine</a>
                        <button id="btnLogout" class="btn btn-outline-danger btn-sm py-1">Sair da Conta</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Seções de Zines -->
        <div id="listaZinesSection" class="row mt-5 d-none">
            <!-- Seção 1: Meus Zines -->
            <div class="col-12 mb-5">
                <h3 class="section-title mb-4">Meus Zines</h3>
                <div id="meusZinesContainer" class="row"></div>
            </div>

            <!-- Seção 2: Zines Publicados da Comunidade -->
            <div class="col-12">
                <h3 class="section-title mb-4">Zines Publicados (Comunidade)</h3>
                <div id="zinesPublicadosContainer" class="row"></div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-dark">
                <div class="modal-header border-bottom border-dark">
                    <h5 class="modal-title text-danger">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-secondary">Tem certeza que deseja excluir este zine permanentemente?</div>
                <div class="modal-footer border-top border-dark">
                    <button type="button" class="btn btn-dark-custom btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarExclusao" class="btn btn-danger btn-sm">Sim, Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Comentários (Clean Dark) -->
    <div class="modal fade" id="modalVerComentarios" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content modal-content-dark">
                <div class="modal-header modal-header-dark px-4 py-3">
                    <h5 class="modal-title fw-semibold fs-5 text-light d-flex align-items-center gap-2">
                        💬 Comentários da Página
                    </h5>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="listaComentariosModalBody" style="background-color: #121212;">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Ampliar Imagem -->
    <div class="modal fade" id="modalZoomImagem" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0 text-end p-2">
                <button type="button" class="btn-close btn-close-white m-2 shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                <div class="modal-body text-center p-0">
                    <img id="imgZoomPreview" src="" alt="Imagem Ampliada" class="img-fluid rounded shadow-lg" style="max-height: 85vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
